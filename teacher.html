<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel local — Modo Prova</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    table { width:100%; border-collapse: collapse; margin-top:20px; font-size:14px; }
    th,td { border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top; }
    th { background:#f6f8fa; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; }
  </style>
</head>
<body>
<main class="app-shell">
  <section class="card" id="loginCard">
    <div class="eyebrow">PAINEL LOCAL</div>
    <h1>Resultados neste computador</h1>
    <p class="subtitle">Protótipo: os dados ficam somente no navegador desta máquina.</p>
    <label>PIN do professor
      <input id="pin" type="password" autocomplete="off" />
    </label>
    <div class="actions"><button class="primary" id="loginBtn">Entrar</button></div>
  </section>

  <section class="card hidden" id="panelCard">
    <div class="eyebrow">PAINEL LOCAL</div>
    <h1>Resultados e ocorrências</h1>
    <p class="subtitle" id="summary"></p>
    <div class="toolbar">
      <button class="primary" id="exportCsv">Exportar CSV</button>
      <button class="secondary" id="exportJson">Exportar JSON</button>
      <button class="danger" id="clearData">Limpar dados deste computador</button>
    </div>
    <div style="overflow:auto"><table>
      <thead><tr><th>Aluno</th><th>Turma</th><th>Início</th><th>Envio</th><th>Objetivas</th><th>Ocorrências</th><th>Motivo</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>
<script src="config.js"></script>
<script src="teacher.js"></script>
</body>
</html>
