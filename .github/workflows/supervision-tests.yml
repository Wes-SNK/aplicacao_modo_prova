name: Supervision module validation

on:
  push:
    branches:
      - feature/sala-espera-monitoramento-gather
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervision-tests:
    name: Node tests and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supervision_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: supervision_ci
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          for file in config.js common.js professor.js student.js presets.js preview-aluno.js supervision-utils.js lobby-curiosities.js lobby.js monitoramento.js alunos.js teacher-login.js teacher-pages.js; do
            node --check "$file"
          done
      - name: Validate SVG map structure without external assets
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("school-map.svg").getroot()
          assert root.tag.endswith("svg")
          assert root.get("viewBox") == "0 0 1200 720"
          print("School SVG valid:", len(list(root.iter())), "elements")
          PY
      - name: Run automated tests
        run: node --test tests/supervision.test.cjs
      - name: Confirm database schema is staged but not applied
        run: |
          test -s migrations/013_supervisao_sala_espera.sql
          test -s migrations/014_gates_inicio_avaliacao.sql
          test -s migrations/015_ajuda_auditoria.sql
          test -s migrations/016_turma_codigos.sql
          test -s migrations/017_autorizacao_antecipada.sql
          test -s migrations/018_duas_permissoes_sem_codigos.sql
          test -s migrations/019_entrada_direta_patio.sql
          test -s migrations/020_visualizacao_turma_selecionada.sql
      - name: Apply migrations to isolated PostgreSQL and test real authorization rules
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/bootstrap-postgres.sql
          for migration in migrations/013_supervisao_sala_espera.sql migrations/014_gates_inicio_avaliacao.sql migrations/015_ajuda_auditoria.sql migrations/016_turma_codigos.sql migrations/017_autorizacao_antecipada.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f tests/supervision-db.sql
          psql -v ON_ERROR_STOP=1 -f tests/supervision-preauth.sql
          psql -v ON_ERROR_STOP=1 -f migrations/018_duas_permissoes_sem_codigos.sql
          psql -v ON_ERROR_STOP=1 -f tests/supervision-two-gates.sql
          psql -v ON_ERROR_STOP=1 -f migrations/019_entrada_direta_patio.sql
          psql -v ON_ERROR_STOP=1 -f tests/supervision-direct-lobby.sql
          psql -v ON_ERROR_STOP=1 -f migrations/020_visualizacao_turma_selecionada.sql
          psql -v ON_ERROR_STOP=1 -f tests/supervision-class-switch.sql
