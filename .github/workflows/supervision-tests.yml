name: Supervision module validation

on:
  push:
    branches:
      - feature/sala-espera-monitoramento-gather
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervision-tests:
    name: Node tests and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          for file in config.js common.js professor.js student.js presets.js preview-aluno.js supervision-utils.js lobby.js monitoramento.js alunos.js; do
            node --check "$file"
          done
      - name: Run automated tests
        run: node --test tests/supervision.test.cjs
      - name: Confirm database schema is staged but not applied
        run: |
          test -s migrations/013_supervisao_sala_espera.sql
          test -s migrations/014_gates_inicio_avaliacao.sql
          test -s migrations/015_ajuda_auditoria.sql
          test -s migrations/016_turma_codigos.sql
