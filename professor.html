<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acesso do professor — Modo Prova</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="teacher-login-page">
  <header class="topbar">
    <strong>Modo Prova — Acesso do professor</strong>
    <span id="teacherConnectionBadge" class="badge">Verificando conexão…</span>
  </header>
  <main class="shell teacher-login-shell">
    <section class="card">
      <h1>Acesso do professor</h1>
      <p class="muted">Entre para acessar o painel de controle, as avaliações, as questões e o cadastro de alunos.</p>
      <form id="teacherLoginForm">
        <label for="teacherEmail">E-mail institucional ou cadastrado</label>
        <input id="teacherEmail" type="email" autocomplete="username" required>
        <label for="teacherPassword">Senha</label>
        <input id="teacherPassword" type="password" autocomplete="current-password" required>
        <p id="teacherLoginMessage" class="message hidden" role="status" aria-live="polite"></p>
        <button id="btnTeacherLogin" type="submit" class="primary">Entrar no painel</button>
      </form>
      <p class="field-help">Apenas professores autorizados podem acessar as informações da turma.</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="teacher-login.js"></script>
</body>
</html>
